<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" role="img" aria-labelledby="t d"><title id="t">PT-DRM-Bench concept</title><desc id="d">Research prototype workflow from experimental records to data quality checks, evidence-based reasoning, and discriminative experiment selection.</desc><rect width="900" height="580" fill="#ece9f5"/><g font-family="Arial,sans-serif" fill="#302748"><text x="52" y="58" font-size="20" letter-spacing="4">03 / EXPERIMENTS → AGENT EVALUATION</text><text x="52" y="141" font-size="44" font-weight="700">PT-DRM-Bench</text><text x="52" y="178" font-size="21">Can an agent reason with imperfect catalyst data?</text></g><g font-family="Arial,sans-serif"><rect x="52" y="250" width="234" height="204" rx="16" fill="#fff"/><text x="76" y="296" font-size="18" fill="#756996">INPUT</text><text x="76" y="341" font-size="25" font-weight="700" fill="#302748">Lab records</text><text x="76" y="383" font-size="18" fill="#6d657b">synthesis · spectra</text><text x="76" y="413" font-size="18" fill="#6d657b">conditions · outcomes</text><rect x="333" y="250" width="234" height="204" rx="16" fill="#fff"/><text x="357" y="296" font-size="18" fill="#756996">REASONING</text><text x="357" y="341" font-size="25" font-weight="700" fill="#302748">Evidence checks</text><text x="357" y="383" font-size="18" fill="#6d657b">units · attribution</text><text x="357" y="413" font-size="18" fill="#6d657b">uncertainty · physics</text><rect x="614" y="250" width="234" height="204" rx="16" fill="#fff"/><text x="638" y="296" font-size="18" fill="#756996">DECISION</text><text x="638" y="341" font-size="25" font-weight="700" fill="#302748">Next experiment</text><text x="638" y="383" font-size="18" fill="#6d657b">tests competing</text><text x="638" y="413" font-size="18" fill="#6d657b">hypotheses</text><text x="52" y="521" font-size="18" fill="#6d657b">Ongoing thesis research · Concept illustration, not a benchmark result.</text></g><path d="M289 352h38M570 352h38" stroke="#756996" stroke-width="4"/></svg>
